<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>app.py — EmoGame 分析看板</title>
  <link rel="stylesheet" href="/api/worktable/template/dshell.css" />
  <style>
    /* 仅代码查看器需要的少量自造样式；配色尽量走 dshell 主题变量 */
    .code-wrap { display:flex; flex-direction:column; gap:8px; }
    .code-toolbar { display:flex; align-items:center; gap:8px; }
    .code-scroll {
      max-height: 64vh; overflow:auto;
      border:1px solid var(--dsw-alias-border-l1, #262b36);
      border-radius:8px;
      background: var(--dsw-alias-fill-l1, rgba(255,255,255,.02));
    }
    pre.code {
      margin:0; padding:8px 0;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Courier New", monospace;
      font-size:12.5px; line-height:1.55;
    }
    .code-line { display:flex; }
    .code-ln {
      flex:none; min-width:3.4em; padding:0 12px 0 8px; text-align:right;
      user-select:none; color: var(--dsw-alias-label-tertiary, #6b7280);
    }
    .code-txt { white-space:pre; padding-right:14px; }
    .tok-kw{color:#c792ea}.tok-str{color:#a5d6a7}
    .tok-com{color:var(--dsw-alias-label-tertiary,#6b7280);font-style:italic}
    .tok-num{color:#f78c6c}.tok-dec{color:#82aaff}.tok-fn{color:#82aaff}
    .tok-builtin{color:#ffcb6b}
    #toast { font-size:12px; color: var(--dsw-alias-label-secondary,#9aa4b2); opacity:0; transition:opacity .3s; }
  </style>
</head>
<body>
  <div class="dshell">
    <h1 class="dshell-title">app.py — EmoGame 分析看板</h1>
    <p class="dshell-sub">Streamlit 多页入口源码 · 实时读取 <code>/home/mzhyui/git/emogame/app.py</code>（打开窗口自动同步最新内容，点「刷新」手动更新）</p>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <span class="dshell-badge dshell-badgeDone">实时同步</span>
      <span class="dshell-badge">Python</span>
      <span class="dshell-badge">Streamlit</span>
      <span class="dshell-badge" id="stat-sync">—</span>
    </div>

    <div class="dshell-grid">
      <div class="dshell-stat"><div class="dshell-statLabel">行数</div><div class="dshell-statValue" id="stat-lines">__LINES__</div></div>
      <div class="dshell-stat"><div class="dshell-statLabel">大小</div><div class="dshell-statValue" id="stat-bytes">__BYTES__ KB</div></div>
      <div class="dshell-stat"><div class="dshell-statLabel">最后更新</div><div class="dshell-statValue" id="stat-mtime" style="font-size:.78em">__MTIME__</div></div>
    </div>

    <div class="code-wrap">
      <div class="code-toolbar">
        <button class="dshell-btn" id="btn-refresh">刷新</button>
        <button class="dshell-btn dshell-btnGhost" id="btn-copy">复制代码</button>
        <span id="toast"></span>
      </div>
      <div class="code-scroll">
        <pre class="code" id="code"></pre>
      </div>
    </div>
  </div>

  <script type="application/json" id="snapshot">__SNAPSHOT__</script>
  <script>
  (() => {
    const FILE_URL = '/api/worktable/file?path=' + encodeURIComponent('/home/mzhyui/git/emogame/app.py');
    const codeEl = document.getElementById('code');
    const snapshot = JSON.parse(document.getElementById('snapshot').textContent);

    const BUILTINS = new Set([
      'print','len','dict','list','set','tuple','str','int','float','bool','range',
      'enumerate','zip','map','filter','sum','min','max','sorted','reversed','any','all',
      'abs','round','isinstance','type','getattr','setattr','hasattr','repr','open',
      'super','staticmethod','classmethod','property','Exception','ValueError','KeyError',
      'TypeError','NotImplementedError','object','self'
    ]);

    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    // 分组顺序: 1注释 2三引号串 3普通串 4装饰器 5数字 6关键字 7函数调用 8普通词
    const TOK = /(#.*$)|((?:[fFrRbBuU]{0,2})(?:"""[\s\S]*?"""|'''[\s\S]*?'''))|((?:[fFrRbBuU]{0,2})(?:"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'))|(@[A-Za-z_]\w*(?:\.[A-Za-z_]\w*)*)|(\b\d[\d_]*(?:\.\d+)?(?:[eE][+-]?\d+)?\b)|(\b(?:def|class|return|import|from|if|elif|else|for|while|in|not|and|or|is|None|True|False|with|as|try|except|finally|raise|pass|break|continue|lambda|global|nonlocal|yield|assert|del|async|await|match|case)\b)|(\b[A-Za-z_]\w*(?=\())|(\b[A-Za-z_]\w*\b)/gm;

    const CLS = ['tok-com', 'tok-str', 'tok-str', 'tok-dec', 'tok-num', 'tok-kw', 'tok-fn', null];

    function highlight(code) {
      let out = '', last = 0, m;
      TOK.lastIndex = 0;
      while ((m = TOK.exec(code)) !== null) {
        out += esc(code.slice(last, m.index));
        let cls = null;
        for (let i = 1; i < 9; i++) {
          if (m[i] !== undefined) { cls = CLS[i - 1]; break; }
        }
        let t = m[0];
        if (cls === null && BUILTINS.has(t)) cls = 'tok-builtin';
        out += cls ? '<span class="' + cls + '">' + esc(t) + '</span>' : esc(t);
        last = m.index + t.length;
        if (TOK.lastIndex === m.index) TOK.lastIndex++;
      }
      out += esc(code.slice(last));
      return out;
    }

    function render(code) {
      const html = highlight(code);
      const frags = html.split('\n');
      if (frags.length && frags[frags.length - 1] === '') frags.pop();
      const out = [];
      const stack = []; // 跨行未闭合的 span 类（当前只可能是跨行字符串）
      const re = /<span class="([^"]+)">|<\/span>/g;
      for (let i = 0; i < frags.length; i++) {
        const body = frags[i];
        const before = stack.slice();
        let m;
        re.lastIndex = 0;
        while ((m = re.exec(body)) !== null) {
          if (m[1] !== undefined) stack.push(m[1]);
          else if (stack.length > 0) stack.pop();
        }
        const prefix = before.map((c) => '<span class="' + c + '">').join('');
        const suffix = '</span>'.repeat(stack.length);
        out.push(
          '<div class="code-line"><span class="code-ln">' + (i + 1) +
          '</span><span class="code-txt">' + prefix + body + suffix + '</span></div>'
        );
      }
      codeEl.innerHTML = out.join('');
    }

    function setStats(code) {
      const bytes = new TextEncoder().encode(code).length;
      const lines = code.split('\n');
      if (lines.length && lines[lines.length - 1] === '') lines.pop();
      document.getElementById('stat-lines').textContent = lines.length;
      document.getElementById('stat-bytes').textContent = (bytes / 1024).toFixed(1) + ' KB';
    }

    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.style.opacity = 1;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.style.opacity = 0; }, 1800);
    }

    async function load(live) {
      const sync = document.getElementById('stat-sync');
      try {
        const res = await fetch(FILE_URL, { cache: 'no-store' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const text = await res.text();
        render(text);
        setStats(text);
        sync.textContent = '已同步 ' + new Date().toLocaleTimeString();
        if (live) toast('已更新为最新内容');
      } catch (e) {
        sync.textContent = '读取失败，显示快照';
        if (live) toast('读取失败：' + e.message);
      }
    }

    // 先快照即时渲染，再拉取实时内容
    render(snapshot);
    setStats(snapshot);
    load(false);

    document.getElementById('btn-refresh').addEventListener('click', () => load(true));
    document.getElementById('btn-copy').addEventListener('click', async () => {
      try {
        const res = await fetch(FILE_URL, { cache: 'no-store' });
        const text = res.ok ? await res.text() : snapshot;
        await navigator.clipboard.writeText(text);
        toast('已复制全部代码');
      } catch (e) {
        toast('复制失败');
      }
    });
  })();
  </script>
</body>
</html>
